<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="description" content="行政甄选 · 商务接待名品目录">
<link rel="icon" href="data:,">
<title>行政甄选 · 商务接待名品目录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>






/* ========== Design System ========== */
:root {
  --navy-deep: #0a1f3d;
  --navy: #1a365d;
  --navy-mid: #2d4a7c;
  --gold: #b8935a;
  --gold-light: #d4b27e;
  --gold-soft: #f0e6d3;
  --ink: #1c1c1e;
  --stone: #6b6b6b;
  --mist: #9a9a9a;
  --bg: #f8f7f4;
  --card: #ffffff;
  --line: #e8e5dd;
  --line-soft: #f0eee8;
  --radius-sm: 6px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow: 0 1px 8px rgba(10, 31, 61, 0.05);
  --shadow-hover: 0 4px 20px rgba(10, 31, 61, 0.1);
  --transition: 0.25s ease;
  --ts-xs: 11px;
  --ts-sm: 13px;
  --ts-base: 15px;
  --ts-md: 17px;
  --ts-lg: 22px;
  --ts-xl: 30px;
  --ts-2xl: 30px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: var(--ts-base);
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  padding-bottom: 40px;
}
a { text-decoration: none; color: inherit; }
ul { list-style: none; }
img { max-width: 100%; display: block; }

/* ========== Hero ========== */
.hero {
  position: relative;
  background: linear-gradient(155deg, var(--navy-deep) 0%, #061a30 50%, #03101f 100%);
  padding: 56px 24px 48px;
  text-align: center;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -40%;
  right: -20%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(184, 147, 90, 0.12) 0%, transparent 70%);
  pointer-events: none;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.hero-mark {
  display: inline-block;
  font-size: var(--ts-sm);
  letter-spacing: 0.35em;
  color: var(--gold-light);
  margin-bottom: 18px;
  font-weight: 300;
  opacity: 0;
  animation: fadeUp 0.6s ease 0.1s forwards;
}
.hero-title {
  font-family: "Noto Serif SC", serif;
  font-size: var(--ts-2xl);
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.06em;
  margin-bottom: 14px;
  line-height: 1.3;
  opacity: 0;
  animation: fadeUp 0.6s ease 0.25s forwards;
}
.hero-title span { color: var(--gold-light); }
.hero-sub {
  font-size: var(--ts-sm);
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.15em;
  font-weight: 300;
  opacity: 0;
  animation: fadeUp 0.6s ease 0.4s forwards;
}
.hero-divider {
  width: 36px;
  height: 2px;
  background: var(--gold);
  margin: 24px auto 0;
  opacity: 0;
  animation: fadeUp 0.6s ease 0.55s forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Notice Bar ========== */
.notice-bar {
  background: linear-gradient(90deg, #fff9e6, #fff4d1);
  border-bottom: 1px solid var(--gold-soft);
  padding: 12px 20px;
  text-align: center;
}
.notice-text {
  font-size: var(--ts-xs);
  color: var(--navy);
  line-height: 1.5;
  letter-spacing: 0.02em;
  max-width: 760px;
  margin: 0 auto;
}
.notice-text::before {
  content: '※';
  color: var(--gold);
  margin-right: 6px;
}

/* ========== Sticky Nav ========== */
.cat-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(248, 247, 244, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.cat-nav-scroll {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding: 0 12px;
}
.cat-nav-scroll::-webkit-scrollbar { display: none; }
.cat-nav-item {
  flex-shrink: 0;
  padding: 14px 16px;
  font-size: var(--ts-sm);
  font-weight: 500;
  color: var(--stone);
  white-space: nowrap;
  position: relative;
  transition: color var(--transition);
  cursor: pointer;
  border: none;
  background: none;
  font-family: inherit;
}
.cat-nav-item.active { color: var(--navy-deep); }
.cat-nav-item.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 2px;
  background: var(--gold);
  border-radius: 1px;
}

/* ========== Intro ========== */
.intro {
  padding: 36px 24px 8px;
  text-align: center;
}
.intro-label {
  font-size: var(--ts-xs);
  letter-spacing: 0.3em;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 10px;
}
.intro-text {
  font-family: "Noto Serif SC", serif;
  font-size: var(--ts-md);
  line-height: 1.8;
  color: var(--ink);
  max-width: 340px;
  margin: 0 auto;
}

/* ========== Section ========== */
.section {
  padding: 36px 16px 8px;
  scroll-margin-top: 48px;
}
.section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding: 0 8px;
}
.section-num {
  font-family: "Noto Serif SC", serif;
  font-size: var(--ts-lg);
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
  opacity: 0.7;
}
.section-title {
  font-family: "Noto Serif SC", serif;
  font-size: var(--ts-lg);
  font-weight: 700;
  color: var(--navy-deep);
  letter-spacing: 0.05em;
}
.section-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--line), transparent);
}

/* ========== Product Grid ========== */
.grid { display: grid; gap: 10px; }
.grid-1 { grid-template-columns: 1fr; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }

/* ========== Product Card ========== */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: box-shadow var(--transition), border-color var(--transition);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.card:hover {
  box-shadow: var(--shadow-hover);
  border-color: var(--gold-soft);
}
.card-img {
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #f5f4f1, #ebe9e2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-img img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 4px;
}
.card-img-placeholder {
  font-size: var(--ts-xs);
  color: var(--mist);
  letter-spacing: 0.05em;
}
.card-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 500;
  color: var(--navy);
  background: rgba(26, 54, 93, 0.06);
  padding: 2px 8px;
  border-radius: 4px;
  align-self: flex-start;
  margin-bottom: 2px;
}
.card-name {
  font-size: var(--ts-sm);
  font-weight: 500;
  color: var(--ink);
  line-height: 1.4;
}
.card-spec {
  font-size: var(--ts-xs);
  color: var(--mist);
  line-height: 1.45;
}
.card-foot {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-top: 4px;
}
.card-price {
  font-family: "Noto Serif SC", serif;
  font-size: var(--ts-md);
  font-weight: 700;
  color: var(--gold);
}
.card-price .yen { font-size: var(--ts-xs); font-weight: 400; }
.card-unit { font-size: 10px; color: var(--mist); }
.card-unit.tax {
  color: var(--gold);
  border: 1px solid var(--gold-soft);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 9px;
  white-space: nowrap;
}

/* Discount card */
.card-discount { gap: 6px; }
.discount-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--ts-xs);
}
.discount-label { color: var(--mist); }
.discount-val {
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  color: var(--navy);
}

/* Fumao timeline card */
.fumao-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.fumao-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.fumao-card:hover { border-color: var(--gold-soft); box-shadow: var(--shadow); }
.fumao-year {
  font-family: "Noto Serif SC", serif;
  font-size: var(--ts-md);
  font-weight: 700;
  color: var(--navy-deep);
}
.fumao-label { font-size: var(--ts-xs); color: var(--mist); margin-top: 2px; }
.fumao-price {
  font-family: "Noto Serif SC", serif;
  font-size: var(--ts-md);
  font-weight: 700;
  color: var(--gold);
}
.fumao-price .yen { font-size: var(--ts-xs); font-weight: 400; }
.fumao-price-wrap { text-align: right; }
.fumao-pre {
  font-size: 10px;
  color: var(--mist);
  margin-top: 3px;
  white-space: nowrap;
}

/* Wide cards (seafood, ftq) */
.card-wide { grid-column: 1 / -1; }
.card-detail { height: auto; }
.detail-layout {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.detail-layout .card-img {
  width: 120px;
  flex-shrink: 0;
  aspect-ratio: 1 / 1;
  margin-bottom: 0;
}
.detail-body { flex: 1; min-width: 0; }
.detail-body .card-spec { margin: 6px 0; }
.detail-body .card-spec .card-spec-more { display: none; }

/* Reveal animation */
.reveal {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.reveal.show { opacity: 1; transform: translateY(0); }

/* Responsive */
@media (min-width: 640px) {
  .hero { padding: 80px 24px 64px; }
  .hero-title { font-size: 38px; letter-spacing: 0.05em; }
  .hero-sub { font-size: 16px; }
  .intro-text { font-size: 19px; max-width: 560px; }
  .section { padding: 48px 24px 8px; }
  .grid-2 { grid-template-columns: repeat(3, 1fr); }
  .grid-1 { grid-template-columns: repeat(2, 1fr); }
  .fumao-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .detail-layout .card-img { width: 160px; }
}

@media (min-width: 1024px) {
  .grid-2 { grid-template-columns: repeat(4, 1fr); }
  .grid-1 { grid-template-columns: repeat(3, 1fr); }
  .fumao-grid { grid-template-columns: repeat(5, 1fr); }
  .section { max-width: 1100px; margin: 0 auto; }
  .detail-layout .card-img { width: 200px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
  html { scroll-behavior: auto; }
}






</style>
</head>
<body>

<!-- ========== Hero ========== -->
<header class="hero">
  <div class="hero-mark" id="heroMark"></div>
  <h1 class="hero-title" id="heroTitle"></h1>
  <p class="hero-sub" id="heroSub"></p>
  <div class="hero-divider"></div>
</header>

<!-- ========== Notice Bar ========== -->
<div class="notice-bar">
  <p class="notice-text" id="noticeText"></p>
</div>

<!-- ========== Category Nav ========== -->
<nav class="cat-nav" aria-label="产品分类导航">
  <div class="cat-nav-scroll" id="catNav"></div>
</nav>

<!-- ========== Intro ========== -->
<section class="intro" id="intro">
  <div class="intro-label">ABOUT</div>
  <p class="intro-text" id="introText"></p>
</section>

<div id="sections"></div>

<script>

(function() {
"use strict";

var DATA_API = '';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtPrice(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'string') return v;
  var n = Number(v);
  if (!isFinite(n)) return null;
  if (Number.isInteger(n)) return String(n);
  return String(n.toFixed(2).replace(/\.?0+$/, ''));
}

function imgHtml(img, name) {
  if (!img) return '<div class="card-img"><div class="card-img-placeholder">暂无图片</div></div>';
  return '<div class="card-img"><img src="' + esc(img) + '" alt="' + esc(name) + '" loading="lazy"></div>';
}

function specHtml(spec, maxLines) {
  if (!spec) return '';
  var limit = maxLines || 99;
  var lines = String(spec).split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
  var html = lines.slice(0, limit).map(function(l) { return esc(l); }).join('<br>');
  if (lines.length > limit) html += '<br><span class="card-spec-more">...</span>';
  return '<p class="card-spec">' + html + '</p>';
}

function footHtml(price, unit, pre) {
  var p = fmtPrice(price);
  if (p === null) return '<div class="card-foot"><span class="card-unit">价格面议</span></div>';
  var html = '<div class="card-foot"><span class="card-price"><span class="yen">¥</span>' + esc(p) + '</span>';
  if (unit) html += '<span class="card-unit">' + esc(unit) + '</span>';
  if (pre !== null && pre !== undefined && pre !== '' && fmtPrice(pre) !== null) {
    html += '<span class="card-unit tax">不含税 ¥' + esc(fmtPrice(pre)) + '</span>';
  }
  html += '</div>';
  return html;
}

function renderWine(c, p) {
  var spec = String(p.spec || '').replace('750ml/瓶', '750ml');
  return '<div class="card reveal">' + imgHtml(p.img, p.name)
    + '<p class="card-name">' + esc(p.name) + '</p>'
    + specHtml(spec)
    + footHtml(p.price_incl, c.unit, p.price_pre) + '</div>';
}

function renderFumao(c, p) {
  var year = p.name.indexOf('(') >= 0 ? String(p.name).split('(').pop().replace(')', '') : '';
  var label = c.fumao_label || '53度福矛窖酒·5';
  var preHtml = '';
  if (typeof p.price_pre === 'number') {
    preHtml = '<div class="fumao-pre">不含税 ¥' + esc(fmtPrice(p.price_pre)) + '</div>';
  }
  return '<div class="fumao-card reveal">'
    + '<div><div class="fumao-year">' + esc(year) + '</div>'
    + '<div class="fumao-label">' + esc(label) + '</div></div>'
    + '<div class="fumao-price-wrap"><div class="fumao-price"><span class="yen">¥</span>' + esc(fmtPrice(p.price_incl)) + '</div>' + preHtml + '</div></div>';
}

function renderTea(c, p) {
  var price = fmtPrice(p.price_incl);
  var isDiscount = typeof p.price_incl === 'string' && p.price_incl.indexOf('折') >= 0;
  if (isDiscount) {
    var brand = String(p.name).replace('全系产品', '') + '全系';
    return '<div class="card reveal card-discount">' + imgHtml(p.img, p.name)
      + '<p class="card-name">' + esc(brand) + '</p>'
      + '<div class="discount-row"><span class="discount-label">采购折扣</span><span class="discount-val">' + esc(price) + '</span></div>'
      + specHtml(p.spec) + '</div>';
  }
  return '<div class="card reveal">' + imgHtml(p.img, p.name)
    + '<p class="card-name">' + esc(p.name) + '</p>'
    + specHtml(p.spec)
    + footHtml(p.price_incl, c.unit, p.price_pre) + '</div>';
}

function renderCigarette(c, p) {
  return '<div class="card reveal">' + imgHtml(p.img, p.name)
    + '<p class="card-name">' + esc(p.name) + '</p>'
    + specHtml(p.spec)
    + footHtml(p.price_incl, c.unit, p.price_pre) + '</div>';
}

function renderStandard(c, p) {
  return '<div class="card reveal">' + imgHtml(p.img, p.name)
    + '<p class="card-name">' + esc(p.name) + '</p>'
    + specHtml(p.spec)
    + footHtml(p.price_incl, c.unit, p.price_pre) + '</div>';
}

function renderSeafood(c, p) {
  return '<div class="card reveal card-wide card-detail"><div class="detail-layout">'
    + imgHtml(p.img, p.name)
    + '<div class="detail-body">'
    + '<p class="card-name">' + esc(p.name) + '</p>'
    + specHtml(p.spec)
    + footHtml(p.price_incl, '', p.price_pre)
    + '</div></div></div>';
}

function renderFtq(c, p) {
  return '<div class="card reveal card-wide card-detail"><div class="detail-layout">'
    + imgHtml(p.img, p.name)
    + '<div class="detail-body">'
    + '<p class="card-name">' + esc(p.name) + '</p>'
    + specHtml(p.spec)
    + footHtml(p.price_incl, c.unit, p.price_pre)
    + '</div></div></div>';
}

var RENDERERS = {
  wine: renderWine, fumao: renderFumao, tea: renderTea,
  cigarette: renderCigarette, standard: renderStandard,
  seafood: renderSeafood, ftq: renderFtq
};

function bindNav() {
  var navItems = document.querySelectorAll('.cat-nav-item');
  var sections = {};
  navItems.forEach(function(item) {
    var target = item.getAttribute('data-target');
    var el = document.getElementById(target);
    if (el) sections[target] = el;
  });

  navItems.forEach(function(item) {
    item.addEventListener('click', function() {
      var target = this.getAttribute('data-target');
      var el = sections[target];
      if (el) {
        var navHeight = document.querySelector('.cat-nav').offsetHeight;
        var top = el.offsetTop - navHeight - 8;
        window.scrollTo({ top: top, behavior: 'smooth' });
      }
    });
  });

  var isScrolling = false;
  function updateActive() {
    if (isScrolling) return;
    var scrollY = window.scrollY + 80;
    var current = 'intro';
    for (var key in sections) {
      if (sections[key].offsetTop <= scrollY) current = key;
    }
    navItems.forEach(function(item) {
      var target = item.getAttribute('data-target');
      if (target === current) {
        item.classList.add('active');
        var navScroll = document.getElementById('catNav');
        var itemLeft = item.offsetLeft;
        var itemWidth = item.offsetWidth;
        var navWidth = navScroll.offsetWidth;
        navScroll.scrollTo({ left: itemLeft - navWidth / 2 + itemWidth / 2, behavior: 'smooth' });
      } else {
        item.classList.remove('active');
      }
    });
  }

  var scrollTimer;
  window.addEventListener('scroll', function() {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(updateActive, 10);
  }, { passive: true });

  navItems.forEach(function(item) {
    item.addEventListener('click', function() {
      isScrolling = true;
      setTimeout(function() { isScrolling = false; }, 800);
    });
  });
}

function initReveal() {
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced || !('IntersectionObserver' in window)) {
    document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('show'); });
    return;
  }
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var delay = Array.from(entry.target.parentNode.children).indexOf(entry.target) * 40;
        setTimeout(function() { entry.target.classList.add('show'); }, Math.min(delay, 300));
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });
}

function render(data) {
  var meta = data.meta || {};
  document.title = (meta.title_a || '') + (meta.title_b || '');
  var desc = document.querySelector('meta[name="description"]');
  if (desc && meta.desc) desc.setAttribute('content', meta.desc);

  document.getElementById('heroMark').textContent = meta.mark || '';
  document.getElementById('heroTitle').innerHTML = esc(meta.title_a || '') + '<span>' + esc(meta.title_b || '') + '</span>';
  document.getElementById('heroSub').textContent = meta.subtitle || '';
  document.getElementById('noticeText').textContent = meta.notice || '';
  document.getElementById('introText').textContent = meta.intro || '';

  var cats = data.categories || [];
  var nav = ['<button class="cat-nav-item active" data-target="intro">首页</button>'];
  cats.forEach(function(c) {
    nav.push('<button class="cat-nav-item" data-target="' + esc(c.id) + '">' + esc(c.nav) + '</button>');
  });
  document.getElementById('catNav').innerHTML = nav.join('\n    ');

  var secs = [];
  cats.forEach(function(c) {
    var renderer = RENDERERS[c.layout] || renderStandard;
    var cards = (c.products || []).map(function(p) { return renderer(c, p); }).join('\n    ');
    secs.push(
      '<!-- ========== ' + c.title + ' ========== -->\n' +
      '<section class="section" id="' + esc(c.id) + '">' +
